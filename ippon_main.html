let cameraPeer = null;
let cameraConnectedRoomId = null;

function connectCamera(roomId) {
  console.log('[CAMERA] connectCamera called, roomId:', roomId);
  if (cameraConnectedRoomId === roomId) { console.log('[CAMERA] already connected to this room'); return; }
  if (cameraPeer) { try { cameraPeer.destroy(); } catch(e) {} }
  cameraConnectedRoomId = roomId;
  cameraPeer = new Peer();
  cameraPeer.on('open', myId => {
    console.log('[CAMERA] MAIN peer opened, myId:', myId);
    const dc = cameraPeer.connect('ippon-host-' + roomId);
    dc.on('open', () => { console.log('[CAMERA] DC opened, sending join'); dc.send('join:' + myId); });
    dc.on('error', (e) => { console.log('[CAMERA] DC error:', e); cameraConnectedRoomId = null; });
  });
  cameraPeer.on('call', call => {
    console.log('[CAMERA] received call from camera');
    call.answer();
    call.on('stream', stream => { console.log('[CAMERA] stream received!'); document.getElementById('camera-video').srcObject = stream; });
    call.on('error', e => console.log('[CAMERA] call error:', e));
  });
  cameraPeer.on('error', (e) => { console.log('[CAMERA] peer error:', e); cameraConnectedRoomId = null; });
}

function showCameraVideo(show) {
  document.getElementById('camera-video').style.display = show ? 'block' : 'none';

};

// 関西版プレイヤー（向かって右=P1=NAKAO）
const PLAYER_IMGS = [
  'https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/image_portrait%2Fkansai%2Fryo.fujimoto.png?alt=media',
  'https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/image_portrait%2Fkansai%2Ftaro.asano.png?alt=media',
  'https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/image_portrait%2Fkansai%2Fchiaki.kubo.png?alt=media',
  'https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/image_portrait%2Fkansai%2Fkohei.bansho.png?alt=media',
  'https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/image_portrait%2Fkansai%2Ftatsuya.nakao.png?alt=media',
];
const sbPlayers = [
  {last: 'FUJIMOTO', first: 'RYO'},
  {last: 'ASANO',    first: 'TARO'},
  {last: 'KUBO',     first: 'CHIAKI'},
  {last: 'BANSHO',   first: 'KOHEI'},
  {last: 'NAKAO',    first: 'TATSUYA'},
];
const STICKS = 10;

function renderScoreboard(scores) {
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = `
<div style="width:100%;height:80px;background:#A100FF;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><div style="color:#fff;font-size:52px;font-weight:900;letter-spacing:0.15em;text-align:center;text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px #c084fc, 0 0 80px #c084fc;">SONG ŌGIRI GRAND PRIX</div></div><div class="sb-stage" style="display:flex;flex-direction:row;align-items:flex-start;justify-content:center;gap:40px;width:100%;padding:4px 16px 0;height:904px;overflow:visible;">` + sbPlayers.map((p, pi) => {
    const sc = scores[4 - pi] || 0;
    const lit = sc % STICKS === 0 && sc > 0 ? STICKS : sc % STICKS;
    const tubes = Array.from({length: STICKS}, (_, i) => `
      <div class="sb-tube-wrap">
        <div class="sb-cap"></div>
        <div class="sb-tube-body ${i < lit ? 'on' : ''}"><span class="sb-tube-label">IPPON</span></div>
        <div class="sb-cap bottom"></div>
      </div>`).join('');
    return `<div class="sb-desk">
      <div class="sb-profile-card">
        <div class="sb-avatar"><img src="${PLAYER_IMGS[pi]}"></div>
        <div class="sb-name" style="color:#000;text-shadow:none;"><div style="font-size:50px;">${p.last}</div>${p.first ? '<div style="font-size:50px;">' + p.first + '</div>' : ''}</div>
      </div>
      <div class="sb-score">${sc}</div>
      <div class="sb-box" style="position:relative;">
        <div style="position:relative;"><div class="sb-box-top"></div></div>
        <div class="sb-tubes-wrap" style="position:relative;">
          <div class="sb-tubes">${tubes}</div>
          ${pi === 0 ? `<svg style="position:absolute;top:0;right:-24px;width:24px;height:304px;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polygon points="0,-16 24,-14.9930 24,0.3357 0,0" fill="#3a3a48"/><polygon points="0,0 24,0.3357 24,291.5804 0,304" fill="#1a1a22"/></svg>` : ''}
          ${pi === 1 ? `<svg style="position:absolute;top:0;right:-14px;width:14px;height:304px;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polygon points="0,-16 14,-14.4151 14,0.5283 0,0" fill="#3a3a48"/><polygon points="0,0 14,0.5283 14,284.4528 0,304" fill="#1a1a22"/></svg>` : ''}
          ${pi === 3 ? `<svg style="position:absolute;top:0;left:-14px;width:14px;height:304px;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polygon points="14,-16 0,-14.4151 0,0.5283 14,0" fill="#3a3a48"/><polygon points="14,0 0,0.5283 0,284.4528 14,304" fill="#1a1a22"/></svg>` : ''}
          ${pi === 4 ? `<svg style="position:absolute;top:0;left:-24px;width:24px;height:304px;overflow:visible;" xmlns="http://www.w3.org/2000/svg"><polygon points="24,-16 0,-14.9930 0,0.3357 24,0" fill="#3a3a48"/><polygon points="24,0 0,0.3357 0,291.5804 24,304" fill="#1a1a22"/></svg>` : ''}
        </div>
      </div>
    </div>`;
  }).join('') + `</div><div style="width:100%;height:80px;background:#A100FF;flex-shrink:0;"></div>`;
}

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentVotes = 0;
let currentRevealed = false;
let currentMode = '';
let ipponTriggered = false;
let imageQueue = [];
let isPlayingImageQueue = false;
let displayedVotes = 0;

window.goFullscreen = () => {
  document.documentElement.requestFullscreen();
  document.getElementById('fullscreen-btn').style.display = 'none';
};

function enqueueImages(fromVotes, toVotes) {
  for (let i = fromVotes + 1; i <= toVotes; i++) imageQueue.push(i);
  if (!isPlayingImageQueue) playNextImage();
}

function playNextImage() {
  if (imageQueue.length === 0) { isPlayingImageQueue = false; return; }
  isPlayingImageQueue = true;
  const votes = imageQueue.shift();
  displayedVotes = votes;
  showVoteImage(votes);
  setTimeout(playNextImage, 150);
}

function showScoreImg(n) {
  document.querySelectorAll('[id^="score-img-"]').forEach(el => el.style.display = 'none');
  const img = document.getElementById('score-img');
  const cached = document.getElementById('score-img-' + n);
  if (cached) { img.style.display = 'none'; cached.style.display = 'block'; }
  else { if (images['main_' + n]) img.src = images['main_' + n]; img.style.display = 'block'; }
}
function showKekkaImg(n) {
  document.querySelectorAll('[id^="kekka-img-"]').forEach(el => el.style.display = 'none');
  const badge = document.getElementById('score-badge');
  const cached = document.getElementById('kekka-img-' + n);
  if (cached) { badge.style.display = 'none'; cached.style.display = 'block'; }
  else { if (images['kekka_' + n]) badge.src = images['kekka_' + n]; badge.style.display = 'block'; }
}
function hideScoreImg() {
  document.querySelectorAll('[id^="score-img-"]').forEach(el => el.style.display = 'none');
  document.getElementById('score-img').style.display = 'none';
}
function hideKekkaImg() {
  document.querySelectorAll('[id^="kekka-img-"]').forEach(el => el.style.display = 'none');
  document.getElementById('score-badge').style.display = 'none';
}

function showVoteImage(votes) {
  if (ipponTriggered) return;
  if (currentMode === 'scoreboard') return;
  if (votes >= 6) {
    ipponTriggered = true;
    const agendaImg = document.getElementById('agenda-img');
    const agendaVideo = document.getElementById('agenda-video');
    agendaImg.style.display = 'none'; document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
    agendaVideo.pause(); agendaVideo.style.display = 'none'; agendaVideo.src = '';
    stopConfetti(document.getElementById('confetti-layer'));
    showKekkaImg(6);
    showCameraVideo(false);
  } else if (currentRevealed) {
    showScoreImg(votes);
    showKekkaImg(votes);
  } else {
    showScoreImg(votes);
    hideKekkaImg();
  }
}

function updateUI() {
  if (ipponTriggered) return;
  if (currentMode === 'scoreboard') return;
  if (currentMode === 'saiten') {
    showCameraVideo(true);
    showScoreImg(currentVotes);
    if (currentRevealed) showKekkaImg(currentVotes);
    else hideKekkaImg();
  } else {
    showCameraVideo(false);
    showScoreImg(currentVotes);
    if (currentRevealed) showKekkaImg(currentVotes);
    else hideKekkaImg();
  }
}

onValue(ref(db, 'camera_room'), (snapshot) => {
  const roomId = snapshot.val();
  console.log('[CAMERA] camera_room changed:', roomId);
  if (roomId) connectCamera(roomId);
  else console.log('[CAMERA] roomId is null/empty');
});

onValue(ref(db, 'scores'), (snapshot) => {
  const scores = snapshot.val() || [0,0,0,0,0];
  renderScoreboard(scores);
});

onValue(ref(db, 'agenda'), (snapshot) => {
  const agendaVideo = document.getElementById('agenda-video');
  const confettiLayer = document.getElementById('confetti-layer');
  const url = snapshot.val();
  document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
  if (url) {
    const isVideo = url.includes('.mp4') || url.includes('.webm') || url.includes('.mov');
    stopConfetti(confettiLayer);
    if (isVideo) {
      if (agendaVideo.getAttribute('src') !== url) agendaVideo.src = url;
      agendaVideo.style.display = 'block';
      const currentUrl = agendaVideo.src;
      agendaVideo.onended = () => {
        remove(ref(db, 'agenda'));
        if (currentUrl.includes('opmovie')) set(ref(db, 'mode'), 'taiki');
      };
      agendaVideo.play().catch(e => console.error(e));
      document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
      document.getElementById('agenda-img').style.display = 'none';
    } else {
      agendaVideo.style.display = 'none';
      const cached = document.querySelector('.agenda-img-cache[data-src="' + url + '"]');
      if (cached) cached.style.display = 'block';
      else { const agendaImg = document.getElementById('agenda-img'); agendaImg.src = url; agendaImg.style.display = 'block'; }
      if (url.includes('winner')) startConfetti(confettiLayer);
    }
  } else {
    get(ref(db, 'keep_audio')).then(snap => {
      if (snap.val()) agendaVideo.style.display = 'none';
      else { agendaVideo.pause(); agendaVideo.style.display = 'none'; agendaVideo.src = ''; }
    });
    document.getElementById('agenda-img').style.display = 'none';
    stopConfetti(confettiLayer);
  }
});

function startConfetti(layer) {
  layer.innerHTML = '';
  const colors = ['#FFD700','#FFC200','#FFB800','#FFD000','#FFCA00','#FFE566','#E8A800'];
  for (let i = 0; i < 150; i++) {
    const el = document.createElement('div');
    el.className = 'cp';
    const w = Math.random() * 12 + 7;
    const h = Math.random() * 20 + 10;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const left = Math.random() * 100;
    const dur = Math.random() * 2.5 + 2;
    const swayDur = Math.random() * 1.5 + 1;
    const delay = Math.random() * -5;
    el.style.cssText = `width:${w}px;height:${h}px;background:${color};left:${left}%;animation-duration:${dur}s,${swayDur}s;animation-delay:${delay}s,${delay}s;opacity:${Math.random()*0.5+0.5};`;
    layer.appendChild(el);
  }
  layer.style.display = 'block';
}
function stopConfetti(layer) { layer.style.display = 'none'; layer.innerHTML = ''; }

onValue(ref(db, 'mode'), (snapshot) => {
  const mode = snapshot.val();
  currentMode = mode || '';
  const sb = document.getElementById('scoreboard');
  if (mode === 'scoreboard') {
    sb.classList.add('visible');
    document.getElementById('score-badge').style.display = 'none';
    const agendaVideo = document.getElementById('agenda-video');
    document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
    agendaVideo.style.display = 'none';
    stopConfetti(document.getElementById('confetti-layer'));
  } else if (mode === 'agenda') {
    sb.classList.remove('visible');
    document.getElementById('score-badge').style.display = 'none';
    hideScoreImg();
    document.getElementById('taiki-img').style.display = 'none';
    document.getElementById('odai-img').style.display = 'none';
    [1,2,3,4,5].forEach(function(n){var el=document.getElementById('odai-img-'+n);if(el)el.style.display='none';});
  } else {
    sb.classList.remove('visible');
    document.getElementById('score-badge').style.display = 'none';
  }
  if (mode === 'saiten') {
    ipponTriggered = false; imageQueue = []; isPlayingImageQueue = false; displayedVotes = 0;
    showCameraVideo(true);
    showScoreImg(0);
  } else {
    showCameraVideo(false);
  }
});

onValue(ref(db, 'taiki'), (snapshot) => {
  const taikiImg = document.getElementById('taiki-img');
  taikiImg.src = images['taiki'];
  taikiImg.style.display = snapshot.val() ? 'block' : 'none';
  if (snapshot.val()) hideScoreImg();
});

document.addEventListener('DOMContentLoaded', function() {
  // お題画像（5問）
  [1,2,3,4,5].forEach(function(n) {
    var url = images['odai_' + n];
    if (!url) return;
    var img = document.createElement('img');
    img.src = url; img.id = 'odai-img-' + n;
    img.style.cssText = 'position:absolute;top:0;left:0;width:100vw;height:100vh;object-fit:cover;display:none;z-index:20;';
    document.body.appendChild(img);
  });
  // 採点中フレーム画像
  [0,1,2,3,4,5,6].forEach(function(n) {
    var url = images['main_' + n];
    if (!url) return;
    var img = document.createElement('img');
    img.src = url; img.id = 'score-img-' + n;
    img.style.cssText = 'position:absolute;top:-2%;left:-1%;width:102%;height:104%;object-fit:fill;display:none;z-index:1;';
    document.body.appendChild(img);
  });
  // kekkaバッジ
  [0,1,2,3,4,5].forEach(function(n) {
    var url = images['kekka_' + n];
    if (!url) return;
    var img = document.createElement('img');
    img.src = url; img.id = 'kekka-img-' + n;
    img.style.cssText = 'position:absolute;left:8vw;bottom:13vh;height:40vh;display:none;z-index:30;';
    document.body.appendChild(img);
  });
  // IPPON全画面
  var ipponUrl = images['kekka_6'];
  if (ipponUrl) {
    var ipponImg = document.createElement('img');
    ipponImg.src = ipponUrl; ipponImg.id = 'kekka-img-6';
    ipponImg.style.cssText = 'position:absolute;top:0;left:0;width:100vw;height:100vh;object-fit:fill;display:none;z-index:30;';
    document.body.appendChild(ipponImg);
  }
  // 初期化
  document.getElementById('odai-img').style.display = 'none';
  [1,2,3,4,5].forEach(function(n) { var el=document.getElementById('odai-img-'+n); if(el) el.style.display='none'; });
  hideKekkaImg(); hideScoreImg();
  const taikiImgInit = document.getElementById('taiki-img');
  if (images['taiki']) { taikiImgInit.src = images['taiki']; taikiImgInit.style.display = 'block'; }
});

onValue(ref(db, 'odai'), (snapshot) => {
  const odaiNum = snapshot.val();
  [1,2,3,4,5].forEach(function(n) { var el=document.getElementById('odai-img-'+n); if(el) el.style.display='none'; });
  document.getElementById('odai-img').style.display = 'none';
  if (odaiNum) {
    var cached = document.getElementById('odai-img-' + odaiNum);
    if (cached) cached.style.display = 'block';
    else if (images['odai_' + odaiNum]) { var odaiImg=document.getElementById('odai-img'); odaiImg.src=images['odai_'+odaiNum]; odaiImg.style.display='block'; }
  }
});

let voteDebounceTimer = null;
let latestVoteCount = 0;

onValue(ref(db, 'votes'), (snapshot) => {
  const allVotes = snapshot.val() || {};
  latestVoteCount = Math.min(Object.keys(allVotes).length, 6);
  clearTimeout(voteDebounceTimer);
  voteDebounceTimer = setTimeout(() => {
    const newVotes = latestVoteCount;
    if (newVotes === 0) {
      currentVotes = 0; ipponTriggered = false; imageQueue = []; isPlayingImageQueue = false; displayedVotes = 0;
      updateUI();
    } else if (newVotes > currentVotes) {
      const from = Math.max(currentVotes, displayedVotes);
      currentVotes = newVotes;
      enqueueImages(from, newVotes);
    }
  }, 50);
});

onValue(ref(db, 'revealed'), (snapshot) => {
  currentRevealed = snapshot.val() || false;
  updateUI();
});
</script>
